services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=r3d
      - MONGODB_INITDB_ROOT_PASSWORD=r3d
    volumes:
      - mongodb_db:/data/db
      - mongodb_configdb:/data/configdb
      - mongodb_mongot:/data/mongot

  proxy:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      MDB_URI: mongodb://r3d:r3d@mongodb:27017/r3d?authSource=admin
      # R3D_API_KEY auto-generated by entrypoint.sh if unset
      CRYPT_SHARED_LIB_PATH: /opt/mongodb/lib/mongo_crypt_v1.so
      # 96-byte local master key (base64). Demo only — NOT for production.
      LOCAL_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0BBQkNERUZHSElKS0xNTk9QUVJTVFVWV1hZWltcXV5f
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_db:
  mongodb_configdb:
  mongodb_mongot:
