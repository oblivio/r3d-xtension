services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=r3d
      - MONGODB_INITDB_ROOT_PASSWORD=r3d
    volumes:
      - mongodb_db:/data/db
      - mongodb_configdb:/data/configdb
      - mongodb_mongot:/data/mongot
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s  # Atlas Local bundles mongot — give it time on cold start

  localstack:
    image: localstack/localstack:latest
    hostname: localstack
    environment:
      - SERVICES=kms
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "kms", "list-keys"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  kms-init:
    image: amazon/aws-cli:latest
    entrypoint: /bin/sh
    command: ["/kms-init.sh"]
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - ./kms-init.sh:/kms-init.sh:ro
      - kms_config:/kms-config
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566

  proxy:
    build: .
    ports:
      - "4000:4000"
    restart: on-failure:3  # Auto-retry on transient bootstrap failures
    env_file:
      - path: .env
        required: false
    environment:
      MDB_URI: mongodb://r3d:r3d@mongodb:27017/r3d?authSource=admin
      # R3D_API_KEY auto-generated by entrypoint.sh if unset
      CRYPT_SHARED_LIB_PATH: /opt/mongodb/lib/mongo_crypt_v1.so
      # AWS KMS Configuration (LocalStack for dev, real AWS for production)
      KMS_PROVIDER: aws
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_KMS_ENDPOINT: "localstack:4566"  # host:port only — libmongocrypt adds HTTPS
      # Extension security
      R3D_ALLOWED_EXTENSION_IDS: "*"  # Set to actual extension ID in production
      # Stealth mode
      OPSEC_STEALTH_MODE: "true"
      # Prevent __pycache__ writes on read-only root filesystem
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - phish_cache:/app/phish_cache
      - kms_config:/kms-config:ro
    # Container security hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # Required for MongoDB crypt_shared library
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Required for binding to port 4000
    tmpfs:
      - /tmp:mode=1777,size=100M
    # Resource limits (prevent DoS against host)
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request,json; r=json.loads(urllib.request.urlopen('http://localhost:4000/health').read()); exit(0 if r.get('status')=='ok' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s  # CSFLE bootstrap + KMS retries can take time
    depends_on:
      mongodb:
        condition: service_healthy
      kms-init:
        condition: service_completed_successfully

volumes:
  mongodb_db:
  mongodb_configdb:
  mongodb_mongot:
  phish_cache:
  localstack_data:
  kms_config:
