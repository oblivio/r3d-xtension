services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: mongodb
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=r3d
      - MONGODB_INITDB_ROOT_PASSWORD=r3d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # LocalStack KMS for QE integration tests with AWS KMS provider
  localstack:
    image: localstack/localstack:latest
    hostname: localstack
    networks:
      default:
        aliases:
          - localhost.localstack.cloud
    environment:
      - SERVICES=kms
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "awslocal", "kms", "list-keys"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  kms-init:
    image: amazon/aws-cli:latest
    entrypoint: /bin/sh
    command: ["/kms-init.sh"]
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - ./kms-init.sh:/kms-init.sh:ro
      - kms_config:/kms-config
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566

  test:
    build: .
    entrypoint: ["python", "-m", "pytest"]
    command: ["-m", "qe", "-v", "--tb=short"]
    environment:
      MDB_URI: mongodb://r3d:r3d@mongodb:27017/r3d_test?authSource=admin
      CRYPT_SHARED_LIB_PATH: /opt/mongodb/lib/mongo_crypt_v1.so
      R3D_API_KEY: test-key
      # Use local provider for tests (simpler, no LocalStack dependency)
      # Switch to KMS_PROVIDER=aws + AWS_KMS_ENDPOINT=localhost.localstack.cloud:4566
      # to test the AWS KMS code path.
      LOCAL_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8gISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0BBQkNERUZHSElKS0xNTk9QUVJTVFVWV1hZWltcXV5f
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app
      - kms_config:/kms-config:ro

volumes:
  kms_config:
