function renderStructured(s,type){
  if(!s||typeof s!=='object')return '';
  const detected=s.headline?'brief':s.chains?'chains':s.triage?'triage':s.exploitScenario?'finding':s.riskSummary?'system':type;
  const field=(l,v,c)=>v?`<div class="ai-field"><span class="ai-label">${l}</span><span class="ai-val"${c?' style="color:'+c+'"':''}>${esc(String(v))}</span></div>`:'';
  const list=(l,items)=>items?.length?`<div class="ai-field"><span class="ai-label">${l}</span>${items.map(i=>`<div class="ai-list-item">${esc(typeof i==='string'?i:i.gap?i.framework+': '+i.gap:i.vector||i.name||JSON.stringify(i))}</div>`).join('')}</div>`:'';

  let execHeader='';
  if(s.executiveSummary||s.tldr||s.businessImpact||s.sampleCurl){
    execHeader+='<div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,0.02)">';
    if(s.tldr) execHeader+=`<div style="font-size:13px;font-weight:700;color:var(--txt-br);margin-bottom:8px">TL;DR &mdash; ${esc(s.tldr)}</div>`;
    if(s.executiveSummary) execHeader+=`<div class="ai-field"><span class="ai-label">Executive Summary</span><span class="ai-val">${esc(s.executiveSummary)}</span></div>`;
    if(s.businessImpact) execHeader+=`<div class="ai-field"><span class="ai-label" style="color:var(--orange)">Business Impact</span><span class="ai-val">${esc(s.businessImpact)}</span></div>`;
    if(s.sampleCurl) execHeader+=`<div class="ai-field"><span class="ai-label">Sample curl</span><div class="ai-code" style="user-select:all;cursor:text">${esc(s.sampleCurl)}</div></div>`;
    execHeader+='</div>';
  }

  const rv=s.redTeamVerdict;
  if(rv&&typeof rv==='object'){
    const engageColor=rv.engage?'var(--green)':'var(--txt-dim)';
    const skipColor=rv.engage===false?'var(--orange)':'var(--txt-dim)';
    const badge=rv.engage?`<span style="background:var(--green);color:#000;font-weight:800;padding:2px 10px;border-radius:4px;font-size:12px;letter-spacing:1px">ENGAGE</span>`:`<span style="background:var(--orange);color:#000;font-weight:800;padding:2px 10px;border-radius:4px;font-size:12px;letter-spacing:1px">SKIP</span>`;
    execHeader+=`<div style="border:1px solid ${rv.engage?'var(--green)':'var(--orange)'};border-radius:8px;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,0.02)">`;
    execHeader+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">${badge}`;
    if(rv.confidence)execHeader+=`<span style="font-family:var(--mono);font-size:11px;color:var(--txt-dim)">Confidence: ${esc(rv.confidence)}</span>`;
    if(rv.priorityRank)execHeader+=`<span style="font-family:var(--mono);font-size:11px;color:var(--accent)">${esc(rv.priorityRank)}</span>`;
    execHeader+=`</div>`;
    if(rv.reasoning)execHeader+=`<div class="ai-field"><span class="ai-label">Verdict</span><span class="ai-val">${esc(rv.reasoning)}</span></div>`;
    execHeader+=`</div>`;
  }

  const sp=s.systemProfile;
  if(sp&&typeof sp==='object'){
    execHeader+=`<div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,0.02)">`;
    execHeader+=`<div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">System Profile</div>`;
    if(sp.description)execHeader+=field('What is this?',sp.description);
    if(sp.techStack)execHeader+=field('Tech Stack',sp.techStack);
    if(sp.authModel)execHeader+=field('Auth Model',sp.authModel);
    if(sp.dataClassification)execHeader+=field('Data Classification',sp.dataClassification);
    execHeader+=`</div>`;
  }

  const as=s.attackSurface;
  if(as&&typeof as==='object'){
    execHeader+=`<div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:rgba(255,255,255,0.02)">`;
    execHeader+=`<div style="font-size:12px;font-weight:700;color:var(--red);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Attack Surface</div>`;
    if(as.entryPoints?.length)execHeader+=list('Entry Points',as.entryPoints);
    if(as.interestingEndpoints?.length)execHeader+=list('Interesting Endpoints',as.interestingEndpoints);
    if(as.quickWins?.length)execHeader+=list('Quick Wins',as.quickWins);
    execHeader+=`</div>`;
  }

  if(detected==='finding'){
    let h=field('Priority',s.priority,PRIORITY_COLOR[s.priority])+field('Effort',s.effort)+field('Exploit Scenario',s.exploitScenario)+field('Blast Radius',s.blastRadius)+field('Remediation',s.remediation)+field('Compliance',s.complianceNote);
    if(s.validation){
      h+='<div class="ai-field"><span class="ai-label">How to Validate</span>';
      if(s.validation.steps?.length)h+=s.validation.steps.map((st,i)=>`<div class="ai-list-item"><strong>${i+1}.</strong> ${esc(st)}</div>`).join('');
      if(s.validation.curlCommand)h+=`<div class="ai-code">${esc(s.validation.curlCommand)}</div>`;
      h+='</div>';
    }
    return execHeader+h;
  }
  if(detected==='system'){
    const vecs=(s.attackVectors||[]).map(v=>typeof v==='string'?`<div class="ai-list-item">${esc(v)}</div>`:`<div class="ai-list-item">${esc(v.vector||'')}${v.test?`<div class="ai-val-inline">${esc(v.test)}</div>`:''}</div>`).join('');
    return execHeader+field('Risk Summary',s.riskSummary)+(vecs?`<div class="ai-field"><span class="ai-label">Attack Vectors</span>${vecs}</div>`:'')+list('Hardening',s.hardeningRecs)+list('Compliance Gaps',s.complianceGaps);
  }
  if(detected==='chains'){
    const chains=(s.chains||[]).map(c=>`<div class="ai-chain"><strong>${esc(c.name)}</strong>${(c.steps||[]).map((st,i)=>`<span class="ai-chain-step">${i+1}. ${esc(st)}</span>`).join('')}<div style="color:var(--orange);font-size:11px;margin-top:4px">${esc(c.impact||'')}</div>${c.validation?`<div class="ai-val-inline">${esc(c.validation)}</div>`:''}</div>`).join('');
    return execHeader+chains+field('Crown Jewel',s.crownJewel)+list('Fix Order',s.fixOrder)+list('Lateral Paths',s.lateralPaths);
  }
  if(detected==='brief')return execHeader+field('Headline',s.headline)+list('Key Risks',s.keyRisks)+list('Immediate Actions',s.immediateActions)+list('Compliance Exposure',s.complianceExposure)+field('Trend',s.trendAssessment);
  if(detected==='triage'){
    return execHeader+`<table class="f-table"><thead><tr><th>P</th><th>Finding</th><th>Justification</th><th>Quick Test</th></tr></thead><tbody>${(s.triage||[]).map(t=>`<tr><td style="color:${PRIORITY_COLOR[t.priority]||'var(--txt-dim)'};font-family:var(--mono);font-weight:800">${esc(t.priority)}</td><td style="color:var(--txt-br);font-weight:600">${esc(t.finding)}</td><td style="color:var(--txt-dim)">${esc(t.justification)}</td><td>${t.quickTest?`<span style="font-family:var(--mono);font-size:10px;color:var(--green)">${esc(t.quickTest)}</span>`:''}</td></tr>`).join('')}</tbody></table>`;
  }
  let fb='';
  for(const[k,v]of Object.entries(s)){if(v==null||v==='')continue;if(Array.isArray(v))fb+=list(k,v);else if(typeof v==='object')fb+=field(k,JSON.stringify(v));else fb+=field(k,String(v))}
  return execHeader+(fb||`<pre style="font-size:10px;color:var(--txt-dim);white-space:pre-wrap">${esc(JSON.stringify(s,null,2))}</pre>`);
}

  return systems.map(s=>{
    const sysFindings=findings.filter(f=>f.data?.systemId===s.id);
    const domain=(s.domains||[])[0]||'';
    const probeUrl=domain?'/r3d/prove?test=headers&url='+encodeURIComponent('https://'+domain):'';

      <input type="checkbox" class="pick-cb" onchange="togglePick('systems','${esc(s.id)}','${esc(s.name)}',this)" ${_picked.systems.has(s.id)?'checked':''}>
      <span class="sys-name">${esc(s.name)}</span>

        ${corsUrl?`<a href="${corsUrl}" target="_blank" style="font-size:9px;font-weight:700;color:var(--orange);text-decoration:none;padding:2px 6px;border:1px solid var(--orange);border-radius:3px;opacity:.8" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.8'">CORS</a>`:''}
        ${domain?`<span id="phish-ctl-${esc(domain)}"><button onclick="clonePhish('${esc(domain)}',this)" style="font-size:9px;font-weight:700;color:var(--red);padding:2px 6px;border:1px solid var(--red);border-radius:3px;background:transparent;cursor:pointer;opacity:.8" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.8'" title="Clone this system as a phishing site with credential capture">PHISH</button></span>`:''}
        <button class="btn-explain" onclick="explainSystem('${esc(s.id)}','${esc(s.name)}',this)" title="Quick AI summary of this system's risk posture">Explain</button>
        <button class="btn btn-ai" onclick="analyzeSystem('${esc(s.id)}','${esc(s.name)}',${s.findings},${s.requests},this)" title="Deep AI risk assessment: attack vectors, hardening recs, compliance gaps">Risk Assessment</button>
      </div>
      <div class="ai-inline" id="ai-sys-${esc(s.id)}" style="width:100%"></div>

function renderEvents(events){
  if(!events.length)return '<div style="color:var(--txt-dim);padding:24px;text-align:center">No events recorded.</div>';
  const types=['all','finding','test_artifact','ai','request','pattern'];
  let html=`<div class="toolbar">${types.map(t=>`<button class="btn ev-filter${t==='all'?' filter-active':''}" data-type="${t}">${t==='all'?'All':t}</button>`).join('')}<span style="color:var(--txt-dim);font-size:11px;margin-left:auto">${events.length} events</span></div>`;
  html+=`<div id="events-list">${renderEventRows(events)}</div>`;
  setTimeout(()=>{
    document.querySelectorAll('.ev-filter').forEach(b=>b.addEventListener('click',()=>{
      const t=b.dataset.type;
      document.querySelectorAll('.ev-filter').forEach(x=>x.classList.toggle('filter-active',x.dataset.type===t));
      const filtered=t==='all'?events:events.filter(e=>e.type===t);
      document.getElementById('events-list').innerHTML=renderEventRows(filtered);
    }));
  },0);
  return html;
}

function renderEventRows(events){
  const allEvents=activeDetail?.events||[];
  return events.slice(0,500).map(e=>{
    const d=e.data||{};
    const time=e.ts_iso?fmtDate(e.ts_iso):e.ts?fmtDate(new Date(e.ts)):'-';
    const evIdx=allEvents.indexOf(e);
    const pickable=e.type==='finding'||e.type==='pattern'||e.type==='test_artifact';
    const summary=d.title||d.findingTitle||d.targetTitle||d.url||d.type||JSON.stringify(d).substring(0,120);
    const cbHtml=pickable?`<input type="checkbox" class="pick-cb" onchange="togglePick('events','${evIdx}','[${esc(e.type)}] ${esc(summary.substring(0,40))}',this)" ${_picked.events.has(String(evIdx))?'checked':''}>`:'<span style="width:14px;display:inline-block"></span>';
    if(e.type==='test_artifact'){
      const v=d.verdict||'inconclusive';
      return `<div class="ev-item">${cbHtml}<span class="ev-time">${esc(time)}</span><span class="ev-type ev-type-test_artifact">TEST</span><span class="ev-data"><span class="verdict-badge verdict-${v}">${v.toUpperCase()}</span> ${esc(d.findingTitle||d.testId||'')} <span style="font-size:10px;color:var(--txt-dim)">${esc(d.targetOrigin||d.executedOn||'')}</span></span></div>`;
    }
    return `<div class="ev-item">${cbHtml}<span class="ev-time">${esc(time)}</span><span class="ev-type ev-type-${e.type}">${esc(e.type)}</span><span class="ev-data">${esc(summary)}</span></div>`;
  }).join('');
}

document.getElementById('main-title').addEventListener('click',function(){
  if(!activeSession||!activeDetail)return;
  const h1=this;
  const current=activeDetail.name||'';
  h1.innerHTML=`<input class="rename-input" value="${esc(current)}" />`;
  const input=h1.querySelector('input');
  input.focus();
  input.select();
  async function save(){
    const newName=input.value.trim();
    if(newName&&newName!==current){
      try{await fetch('/r3d/sessions/'+activeSession,{method:'PATCH',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({name:newName})})}catch{}
      activeDetail.name=newName;
      loadSessions();
    }
    h1.textContent=activeDetail.name||'Session';
  }
  input.addEventListener('blur',save);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}if(e.key==='Escape'){h1.textContent=current}});
});

// SSE real-time streaming — deferred until bootstrap completes
let es=null;
let sseConnected=false;

function initSSE(){
  if(es) return;
  es=new EventSource('/r3d/stream');
  es.onmessage=_handleSSE;
  es.onerror=()=>{sseConnected=false;const b=document.getElementById('sse-badge');if(b){b.style.background='var(--orange)';b.title='SSE reconnecting'}};
}

function _handleSSE(e){
  try{
    const msg=JSON.parse(e.data);
    if(msg.type==='connected'){sseConnected=true;document.getElementById('sse-badge').style.background='var(--green)';document.getElementById('sse-badge').title='Live';return}
    if(msg.type==='session_start'||msg.type==='session_end'||msg.type==='session_rename'||msg.type==='session_delete'){
      loadSessions();
      if(msg.type==='session_end'&&msg.sessionId===activeSession){
        setTimeout(()=>selectSession(activeSession),1000);
      }
      if(msg.type==='session_delete'&&msg.sessionId===activeSession){
        activeSession=null;activeDetail=null;
        document.getElementById('main-title').textContent='Select a session';
        document.getElementById('main-content').innerHTML='<div id="main-empty" style="padding:60px;color:var(--txt-dim);text-align:center"><div style="font-size:14px">Select a session from the sidebar</div></div>';
      }
    }
    if(msg.type==='events'&&msg.sessionId===activeSession&&activeDetail){
      const newEvents=msg.events||[];
      if(newEvents.length>0){
        if(!activeDetail.events)activeDetail.events=[];
        activeDetail.events.push(...newEvents);
        renderDetail();
      }
    }
    if(msg.type==='test_result'){
      const tid=msg.testId||'';
      const el=document.getElementById('test-result-'+tid);
      if(el){
        const output=msg.output||'';
        const isFetchBlock=output.includes('Failed to fetch')||output.includes('NetworkError')||output.includes('net::ERR_');
        const isCSPBlock=output.includes('Content Security Policy')||output.includes('connect-src')||output.includes('refused to connect');
        const networkFail=isFetchBlock||isCSPBlock;
        let verdict=msg.verdict||((output).includes('VULNERABLE')?'vulnerable':(output).includes('SAFE')?'safe':'inconclusive');
        if(verdict==='safe'&&networkFail) verdict='blocked';
        const vColors={vulnerable:'var(--red)',safe:'var(--green)',error:'var(--red)',inconclusive:'var(--accent)',blocked:'var(--orange)'};
        const vLabels={vulnerable:'VULNERABLE',safe:'SAFE',error:'FAILED',inconclusive:'EXECUTED',blocked:'BLOCKED'};
        const color=msg.error?'var(--red)':vColors[verdict]||'var(--accent)';
        const icon=msg.error?'FAILED':vLabels[verdict]||'EXECUTED';
        const targetInfo=msg.executedOn?`<div style="font-size:9px;color:var(--txt-dim);margin-bottom:4px">Target: ${esc(msg.executedOn)}</div>`:'';
        const blockedNote=verdict==='blocked'?`<div style="margin-top:6px;padding:8px 10px;border-radius:6px;background:rgba(255,145,0,.06);border:1px solid rgba(255,145,0,.15);font-size:10px;color:var(--orange);line-height:1.6">
          <strong style="display:block;margin-bottom:3px">Network blocked</strong>
          The test snippet tried to reach an endpoint that the target page's CSP or network policy blocked. This does not mean the vulnerability is absent — the test methodology needs adjustment. Try regenerating the test or use the proxy relay endpoints.
        </div>`:'';
        el.innerHTML=`<div style="margin-top:8px;padding:10px 12px;border:1px solid ${color};border-radius:var(--r);background:rgba(0,0,0,.3);animation:panelIn .2s var(--ease)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span class="verdict-badge verdict-${verdict==='blocked'?'error':verdict}">${icon}</span>
            <span style="font-size:10px;color:var(--txt-dim)">Test Result</span>
          </div>
          ${targetInfo}
          ${output?`<pre style="font-family:var(--mono);font-size:11px;color:var(--txt);white-space:pre-wrap;margin:0;line-height:1.6">${esc(output)}</pre>`:''}
          ${msg.error?`<div style="font-size:11px;color:var(--red);margin-top:4px">${esc(msg.error)}</div>`:''}
          ${blockedNote}
        </div>`;
      }
    }
    if(msg.type==='token_validated'){
      const bl=document.getElementById('beacon-log')||(() => { const c=document.createElement('div');c.id='beacon-log';c.style.cssText='position:fixed;bottom:12px;right:12px;max-width:420px;z-index:9999';document.body.appendChild(c);return c })();
      const color=msg.valid?'var(--red)':'var(--green)';
      const label=msg.valid?'TOKEN VALID — ACCOUNT TAKEOVER CONFIRMED':'TOKEN REJECTED — NOT EXPLOITABLE';
      bl.innerHTML=`<div style="background:var(--bg2);border:2px solid ${color};border-radius:6px;padding:12px 16px;margin-top:6px;box-shadow:0 4px 20px rgba(0,0,0,.5)">
        <div style="font-size:11px;font-weight:900;color:${color};margin-bottom:6px">${label}</div>
        ${msg.valid?`<div style="font-size:11px;color:var(--txt)">email: ${esc(msg.email||'?')}<br>name: ${esc(msg.name||'?')}<br>sub: ${esc(msg.sub||'?')}</div>`:''}
      </div>`;
      setTimeout(()=>{if(bl)bl.innerHTML=''},20000);
    }
    if(msg.type==='code_exchanged'||msg.type==='code_rejected'){
      const bl=document.getElementById('beacon-log')||(() => { const c=document.createElement('div');c.id='beacon-log';c.style.cssText='position:fixed;bottom:12px;right:12px;max-width:420px;z-index:9999';document.body.appendChild(c);return c })();
      const ok=msg.success;
      bl.innerHTML=`<div style="background:var(--bg2);border:2px solid ${ok?'var(--red)':'var(--green)'};border-radius:6px;padding:12px 16px;margin-top:6px;box-shadow:0 4px 20px rgba(0,0,0,.5)">
        <div style="font-size:11px;font-weight:900;color:${ok?'var(--red)':'var(--green)'}">${ok?'CODE EXCHANGED — PKCE IS MISSING':'CODE REJECTED — PKCE ENFORCED'}</div>
        <div style="font-size:10px;color:var(--txt-dim);margin-top:4px">${esc(msg.tokenEndpoint||'')} → HTTP ${msg.status||'?'}${msg.hasPKCEError?' (PKCE required)':''}</div>
      </div>`;
      setTimeout(()=>{if(bl)bl.innerHTML=''},20000);
    }
    if(msg.type==='scan_progress'){
      const log=document.getElementById('scan-live-log');
      if(log){
        const latest=msg.latest||{};
        const vColor=latest.verdict==='vulnerable'?'var(--red)':latest.verdict==='safe'?'var(--green)':'var(--txt-dim)';
        const pct=msg.total?Math.round(msg.completed/msg.total*100):0;
        if(!log.querySelector('#scan-progress-bar'))log.insertAdjacentHTML('beforeend',`<div style="margin-bottom:8px"><div style="background:var(--bg);border-radius:4px;height:6px;overflow:hidden"><div id="scan-progress-bar" style="background:var(--accent);height:100%;width:0%;transition:width .3s"></div></div><div id="scan-progress-label" style="font-size:10px;color:var(--txt-dim);margin-top:4px"></div></div><div id="scan-results-list" style="max-height:300px;overflow-y:auto"></div>`);
        const bar=document.getElementById('scan-progress-bar');
        const label=document.getElementById('scan-progress-label');
        if(bar)bar.style.width=pct+'%';
        if(label)label.textContent=`${msg.completed} / ${msg.total} probes (${pct}%)`;
        if(latest.url){
          const list=document.getElementById('scan-results-list');
          if(list)list.insertAdjacentHTML('afterbegin',`<div style="font-size:10px;padding:3px 0;border-bottom:1px solid var(--border);font-family:var(--mono)"><span style="color:${vColor};font-weight:700">${(latest.verdict||'?').toUpperCase().padEnd(12)}</span> <span style="color:var(--accent)">${esc(latest.method||'GET')}</span> ${esc((latest.url||'').substring(0,60))} <span style="color:var(--txt-dim)">→ ${latest.status||'?'}</span>${latest.payload?` <span style="color:var(--orange)">${esc((latest.payload||'').substring(0,25))}</span>`:''}</div>`);
        }
      }
    }
    if(msg.type==='scan_complete'){
      const log=document.getElementById('scan-live-log');
      if(log){
        const vulnCount=msg.vulnerable||msg.anomalies?.length||0;
        const bar=document.getElementById('scan-progress-bar');
        if(bar)bar.style.width='100%';
        const label=document.getElementById('scan-progress-label');
        if(label)label.innerHTML=`<span style="color:var(--green);font-weight:700">Scan complete</span> — ${msg.totalProbes||msg.results?.length||0} probes${vulnCount?`, <span style="color:var(--red);font-weight:700">${vulnCount} vulnerabilities found</span>`:`, <span style="color:var(--green)">no vulnerabilities found</span>`}`;
        const status=document.getElementById('scan-status');
        if(status)status.innerHTML=`<div style="color:${vulnCount?'var(--red)':'var(--green)'};font-weight:700;font-size:14px">${vulnCount?vulnCount+' vulnerabilities confirmed':'All probes returned clean'}</div>`;
      }
    }
    if(msg.type==='graph_built'){
      const el=document.getElementById('graph-stats');
      if(el) el.innerHTML=`<span style="color:var(--green);font-family:var(--mono)">Graph updated: ${msg.nodeCount} nodes, ${msg.edgeCount} edges, ${msg.pathCount} paths</span>`;
    }
    if(msg.type==='spec_imported'){
      const el=document.getElementById('spec-status');
      if(el) el.innerHTML=`<span style="color:var(--green)">Spec "${esc(msg.name)}" imported: ${msg.endpointCount} endpoints, ${msg.sensitiveCount} sensitive</span>`;
    }
    if(msg.type==='beacon_received'){
      const beaconEl=document.getElementById('beacon-log');
      if(!beaconEl){
        const container=document.createElement('div');
        container.id='beacon-log';
        container.style.cssText='position:fixed;bottom:12px;right:12px;max-width:400px;z-index:9999';
        document.body.appendChild(container);
      }
      const bl=document.getElementById('beacon-log');
      const bodyPreview=(msg.body||'').substring(0,200);
      bl.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--red);border-radius:6px;padding:10px 14px;margin-top:6px;animation:fadeIn .3s">
        <div style="font-size:10px;font-weight:800;color:var(--red);margin-bottom:4px">BEACON RECEIVED — EXFIL CHANNEL CONFIRMED</div>
        <div style="font-size:10px;color:var(--txt-dim)">Origin: ${esc(msg.origin||'unknown')} | ${esc(msg.method||'')} | ${msg.ts||''}</div>
        ${bodyPreview?`<pre style="font-size:10px;color:var(--orange);margin:4px 0 0;white-space:pre-wrap;max-height:80px;overflow:hidden">${esc(bodyPreview)}</pre>`:''}
      </div>`;
      setTimeout(()=>{if(bl)bl.innerHTML=''},15000);
    }
    if(msg.type==='phish_credential_captured'){
      const bl=document.getElementById('beacon-log')||(()=>{const c=document.createElement('div');c.id='beacon-log';c.style.cssText='position:fixed;bottom:12px;right:12px;max-width:420px;z-index:9999';document.body.appendChild(c);return c})();
      const fields=msg.fieldCount?msg.fieldCount+' fields captured':'data intercepted';
      bl.innerHTML=`<div style="background:var(--bg2);border:2px solid var(--red);border-radius:6px;padding:12px 16px;margin-top:6px;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:fadeIn .3s">
        <div style="font-size:11px;font-weight:900;color:var(--red);margin-bottom:6px">CREDENTIAL CAPTURED \u2014 PHISHING PAYLOAD CONFIRMED</div>
        <div style="font-size:10px;color:var(--txt-dim)">Target: ${esc(msg.targetUrl||'')} | ${esc(fields)} | ${esc(msg.captureType||'')} | ${msg.ts||''}</div>
      </div>`;
      setTimeout(()=>{if(bl)bl.innerHTML=''},20000);
    }
    if(msg.type==='phish_cloned'){
      const ctl=document.getElementById('phish-ctl-'+msg.targetUrl?.replace(/^https?:\/\//,'').split('/')[0]);
      if(ctl){
        const serveUrl=location.origin+(msg.serveUrl||'');
        ctl.innerHTML=`<a href="${msg.serveUrl||''}" target="_blank" style="font-size:9px;font-weight:700;color:var(--red);text-decoration:none;padding:2px 6px;border:1px solid var(--red);border-radius:3px;opacity:.9" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='.9'">PHISH LIVE</a>`
          +`<button onclick="copyToClipboard(this,'${serveUrl}')" style="font-size:9px;font-weight:600;color:var(--txt);padding:2px 6px;border:1px solid var(--border);border-radius:3px;background:var(--bg3);cursor:pointer">Copy Link</button>`;
      }
    }
    if(msg.type==='pivot_progress'&&msg.sessionId===activeSession){
      const el=document.getElementById('pivot-results');
      if(el&&!el.querySelector('[data-pivot-card]'))el.innerHTML=`<div style="padding:12px;font-size:11px;color:var(--orange)"><span style="display:inline-block;width:10px;height:10px;border:2px solid var(--orange);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px"></span>Pivot ${(msg.index||0)+1}/${msg.total||'?'}: ${msg.entry?.verdict==='confirmed'?'<span style="color:var(--green);font-weight:700">CONFIRMED</span>':'<span style="color:var(--txt-dim)">rejected</span>'} ${esc(msg.entry?.source||'')} → ${esc(msg.entry?.target||'')}</div>`;
    }
    if(msg.type==='pivot_complete'&&msg.sessionId===activeSession){
      const el=document.getElementById('pivot-results');
      if(el)el.innerHTML=`<div style="padding:12px;font-size:12px"><span style="color:var(--green);font-weight:800">${msg.confirmed||0} confirmed</span> lateral movement paths, <span style="color:var(--txt-dim)">${msg.rejected||0} rejected</span> — graph updated</div>`;
    }
    if(msg.type==='plan_step_start'&&msg.sessionId===activeSession&&_currentPlan){
      const stepEl=document.getElementById('plan-step-'+msg.index);
      if(stepEl){
        const badge=stepEl.querySelector('span:nth-child(3)');
        if(badge){badge.style.background='rgba(255,145,0,.15)';badge.style.color='#ff9100';badge.textContent='RUNNING'}
      }
    }
    if(msg.type==='plan_step_complete'&&msg.sessionId===activeSession&&_currentPlan){
      const r=msg.result||{};
      if(!_currentPlan.results)_currentPlan.results=[];
      _currentPlan.results.push(r);
      const step=(_currentPlan.steps||[]).find(s=>s.index===r.index);
      if(step){
        const stepEl=document.getElementById('plan-step-'+r.index);
        if(stepEl)stepEl.outerHTML=renderPlanStep(step,r);
      }
    }
    if(msg.type==='plan_complete'&&msg.sessionId===activeSession&&_currentPlan){
      _currentPlan.status='complete';
      _currentPlan.verdict=msg.verdict||{};
      renderAttackPlan(_currentPlan);
    }
  }catch{}
}

window.importSpecFromUrl=async function(){
  const url=document.getElementById('spec-url').value.trim();
  if(!url)return;
  const el=document.getElementById('spec-status');
  el.innerHTML='<span style="color:var(--accent)">Importing...</span>';
  try{
    const r=await fetch('/r3d/spec/import',{method:'POST',headers:{...authHeaders(),'Content-Type':'application/json'},body:JSON.stringify({url,sessionId:activeDetail?.id||''})});
    const data=await r.json();
    el.innerHTML=`<span style="color:var(--green)">Imported "${esc(data.name)}" — ${data.endpointCount} endpoints</span>`;
    renderSpecEndpoints(data);
    loadSpecList();
  }catch(e){el.innerHTML=`<span style="color:var(--red)">${esc(e.message)}</span>`}
}

window.uploadSpecFile=async function(){
  const file=document.getElementById('spec-file').files[0];

// ─── Attack Graph — auto-build + auto-enrich ─────────────────────────

let _graphData=null;
let _graphLoading=false;
let _graphFocusedPathIdx=null;
let _ghostEdgesVisible=true;
let _graphSelectedNodeId=null;
let _graphListSort='risk';
let _graphListSearch='';
const _graphExpandedFull={};
let _graphInteractionMode='navigator';

function edgeKey(from,to){return `${from}->${to}`}

function graphNodeName(node){return node?(node.name||node.title||node.id||'Unknown node'):'Unknown node'}
function graphNodeTypeLabel(node){return ((node?.type||'node')+'').replace(/_/g,' ')}
function graphNodeTone(node){
  if(!node) return 'var(--txt-dim)';
  if(node.type==='vulnerability') return 'var(--red)';
  if(node.type==='credential') return 'var(--yellow)';
  if(node.type==='data_asset') return 'var(--purple)';
  return 'var(--accent)';
}
function getGraphLinks(){
  const base=_graphData?.edges||[];
  const extra=_ghostEdgesVisible?(_graphData?.enrichment?.additionalEdges||[]):[];
  return [
    ...base.map(l=>({...l,source:l.from,target:l.to})),
    ...extra.map(l=>({...l,source:l.from||l.source,target:l.to||l.target,isGhost:true}))
  ];
}
function getGraphNodeById(nodeId){
  return (_graphData?.nodes||[]).find(n=>n.id===nodeId)||null;
}
function renderGraphInspector(html){
  const el=document.getElementById('graph-inspector');
  if(!el) return;
  if(!html){el.innerHTML='';return}
  el.innerHTML=`<div class="graph-inspector-panel">${html}</div>`;
}
window.renderGraphOverview=function(){
  renderGraphInspector('');
};
window.inspectAttackPath=function(path, idx, opts){
  if(!path) return;
  const nodeMap=Object.fromEntries((_graphData?.nodes||[]).map(n=>[n.id,n]));
  const steps=(path.path||[]).map((nodeId,stepIdx)=>{
    const node=nodeMap[nodeId];
    const name=graphNodeName(node)||nodeId;
    const type=graphNodeTypeLabel(node);
    const risk=node?.riskScore!=null?`Risk ${node.riskScore}`:'';
    const sev=node?.severity?node.severity:'';
    return `<div class="graph-path-step ${opts?.activeStep===stepIdx?'active':''}">
      <div class="graph-path-step-num">${stepIdx+1}</div>
      <div class="graph-path-step-copy">
        <div class="name">${esc(name)}</div>
        <div class="meta">${esc(type)}${risk?` • ${esc(risk)}`:''}${sev?` • ${esc(sev)}`:''}</div>
      </div>
    </div>`;
  }).join('');
  renderGraphInspector(`<div class="graph-inspector-kicker">${opts?.mode==='tour'?'Guided Walkthrough':'Attack Path'}</div>
    <div class="graph-inspector-title">${esc(path.name||`Path ${idx+1}`)}</div>
    <div class="graph-inspector-body">${esc(path.description||path.impact||'AI-ranked attack chain connecting an entry point to a high-value target.')}</div>
    ${opts?.mode==='tour'?`<div class="graph-tour-progress"><div class="graph-tour-progress-fill" style="width:${Math.max(8,Math.min(100,((opts.activeStep||0)+1)/Math.max((path.path||[]).length,1)*100))}%"></div></div>`:''}
    <div class="graph-inspector-grid">
      <div class="graph-inspector-stat"><div class="k">Entry</div><div class="v">${esc(path.sourceName||path.path?.[0]||'Unknown')}</div></div>

window.inspectGraphNode=function(node, opts){
  if(!node) return renderGraphOverview();
  _graphSelectedNodeId=node.id;
  const links=getGraphLinks();
  const related=links.filter(l=>{
    const source=typeof l.source==='object'?l.source.id:l.source;
    const target=typeof l.target==='object'?l.target.id:l.target;
    return source===node.id||target===node.id;
  });
  const incoming=related.filter(l=>(typeof l.target==='object'?l.target.id:l.target)===node.id);
  const outgoing=related.filter(l=>(typeof l.source==='object'?l.source.id:l.source)===node.id);
  const neighbors=[...new Set(related.map(l=>{
    const source=typeof l.source==='object'?l.source.id:l.source;
    const target=typeof l.target==='object'?l.target.id:l.target;
    return source===node.id?target:source;
  }))].map(getGraphNodeById).filter(Boolean).slice(0,6);
  const badges=[
    node.severity?`Severity: ${node.severity}`:'',
    node.status?`Status: ${node.status}`:'',
    node.riskScore!=null?`Risk: ${node.riskScore}`:'',
    node.kind?`Kind: ${node.kind}`:'',
    node.confidence?`Confidence: ${node.confidence}`:''
  ].filter(Boolean).map(t=>`<span class="graph-pill">${esc(t)}</span>`).join('');
  renderGraphInspector(`<div class="graph-inspector-kicker">${opts?.mode==='tour'?'Walkthrough Focus':'Node Inspector'}</div>
    <div class="graph-inspector-title" style="color:${graphNodeTone(node)}">${esc(graphNodeName(node))}</div>
    <div class="graph-inspector-body">${esc(opts?.summary||node.reasoning||node.title||'Selected node in the current attack surface graph.')}</div>
    <div class="graph-pill-row">${badges||'<span class="graph-pill">No extra metadata</span>'}</div>
    <div class="graph-inspector-grid">
      <div class="graph-inspector-stat"><div class="k">Type</div><div class="v">${esc(graphNodeTypeLabel(node))}</div></div>
      <div class="graph-inspector-stat"><div class="k">Links</div><div class="v">${related.length}</div></div>
      <div class="graph-inspector-stat"><div class="k">Inbound</div><div class="v">${incoming.length}</div></div>
      <div class="graph-inspector-stat"><div class="k">Outbound</div><div class="v">${outgoing.length}</div></div>
    </div>
    ${neighbors.length?`<div class="graph-inspector-section"><h4>Connected Nodes</h4><div class="graph-list">${neighbors.map(n=>`<div class="graph-list-item"><strong>${esc(graphNodeName(n))}</strong><div style="font-size:10px;color:var(--txt-dim);margin-top:4px">${esc(graphNodeTypeLabel(n))}</div></div>`).join('')}</div></div>`:''}
    ${opts?.tourNote?`<div class="graph-inspector-section"><h4>Tour Note</h4><div class="graph-callout">${esc(opts.tourNote)}</div></div>`:''}`);
};

window.buildGraph=async function(btn){
  btn.classList.add('loading');btn.textContent='Building graph...';
  const statusEl=document.getElementById('graph-build-status');
  if(statusEl)statusEl.innerHTML=`<div style="text-align:center;padding:12px"><span style="display:inline-block;width:18px;height:18px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite"></span><div style="font-size:11px;color:var(--txt-dim);margin-top:8px">Building nodes and edges from session data...</div></div>`;
  _graphLoading=true;
  _graphInteractionMode='navigator';
  try{
    const r=await fetch('/r3d/graph/build/'+activeDetail.id,{method:'POST',headers:{...authHeaders(),'Content-Type':'application/json'},body:'{}'});
    _graphData=await r.json();
    const root=document.getElementById('graph-root');
    renderFullGraph(root);
    const aiStatus=document.getElementById('graph-ai-status');
    if(aiStatus)aiStatus.innerHTML='<span style="color:var(--purple);font-size:11px">AI analyzing attack paths...</span><span style="display:inline-block;width:10px;height:10px;border:2px solid var(--purple);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-left:4px"></span>';
    try{
      const er=await fetch('/r3d/graph/'+activeDetail.id+'/enrich',{method:'POST',headers:{...authHeaders(),'Content-Type':'application/json'},body:'{}'});
      const eData=await er.json();
      if(eData.enrichment){try{renderEnrichment(eData.enrichment)}catch(renderErr){console.warn('[R3D] Enrichment render error:',renderErr)}}
      if(aiStatus)aiStatus.innerHTML='<span style="color:var(--green);font-size:11px">AI analysis complete</span>';
    }catch(enrichErr){
      if(aiStatus)aiStatus.innerHTML=`<span style="color:var(--orange);font-size:11px">AI enrichment unavailable</span>`;
      console.warn('[R3D] Enrichment fetch error:',enrichErr);
    }
  }catch(e){
    if(statusEl)statusEl.innerHTML=`<div style="text-align:center;color:var(--red);padding:12px">${esc(e.message)}</div>`;
    btn.classList.remove('loading');btn.textContent='Retry';
  }
  _graphLoading=false;
};

    <div id="graph-planner" style="margin-top:16px"></div>
  </div>`;
  if(graphMode==='visual') renderGraphCompactVisual(data);
  else renderGraphSystemList(data);
  if(paths.length) renderGraphPaths(data);
  if(_graphFocusedPathIdx!=null&&paths[_graphFocusedPathIdx]) inspectAttackPath(paths[_graphFocusedPathIdx],_graphFocusedPathIdx);
  else renderGraphOverview();
  if(_graphData?.pivotResults?.length) renderPivotResults(_graphData.pivotResults);
}

function _str(v){if(v==null)return '';if(typeof v==='string')return v;if(typeof v==='number')return String(v);return JSON.stringify(v)}

function shouldUseCompactVisualGraph(data){
  const nodes=data?.nodes||[];
  const baseEdges=data?.edges||[];
  const systems=nodes.filter(n=>n.type==='system').length;
  const nonSystems=nodes.length-systems;
  return systems>0 && nodes.length<=18 && baseEdges.length<=24 && systems<=4 && nonSystems<=14;
}

function graphMiniNodeSize(node){
  if(node?.type==='system') return {w:160,h:54,r:22};
  if(node?.type==='credential') return {w:146,h:42,r:16};
  if(node?.type==='data_asset') return {w:152,h:42,r:16};
  return {w:156,h:42,r:16};
}

function graphMiniNodeMeta(node){
  if(node?.type==='system') return `Risk ${Math.min(100,node.riskScore||0)}`;
  if(node?.severity) return `${node.severity}${node.status?` • ${String(node.status).toUpperCase()}`:''}`;
  if(node?.status) return String(node.status).toUpperCase();
  return graphNodeTypeLabel(node);
}

function graphMiniNodeLabel(node){
  const raw=graphNodeName(node);
  return raw.length>28?raw.slice(0,27)+'…':raw;
}

function graphMiniEdgePath(a,b){
  const dx=Math.abs(b.x-a.x);
  const curve=Math.max(26,Math.min(110,dx*.2));
  return `M ${a.x} ${a.y} C ${a.x} ${a.y+curve}, ${b.x} ${b.y-curve}, ${b.x} ${b.y}`;
}

function renderGraphCompactVisual(data){
  const container=document.getElementById('graph-container');
  if(!container) return;
  const nodes=data.nodes||[];
  const systems=nodes.filter(n=>n.type==='system');
  if(!systems.length){
    container.innerHTML='<div class="graph-visual-empty">No systems available for the compact attack map.</div>';
    return;
  }
  const linkSet=getGraphLinks();
  const baseEdges=linkSet.filter(l=>!l.isGhost);
  const nodeMap=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const width=Math.max(860,systems.length*250);
  const height=390;
  const yTop=92;
  const positions={};
  const positioned=new Set();
  const sysStep=systems.length===1?0:(width-220)/(systems.length-1);

  systems.forEach((sys,idx)=>{
    const x=systems.length===1?width/2:110+idx*sysStep;
    positions[sys.id]={x,y:yTop};
    positioned.add(sys.id);
  });

  systems.forEach(sys=>{
    const attached=[...new Set(baseEdges.flatMap(l=>{
      const from=typeof l.source==='object'?l.source.id:l.source;
      const to=typeof l.target==='object'?l.target.id:l.target;
      if(from===sys.id&&to!==sys.id) return [to];
      if(to===sys.id&&from!==sys.id) return [from];
      return [];
    }))].map(id=>nodeMap[id]).filter(n=>n&&n.type!=='system');
    attached.forEach((node,idx)=>{
      if(positioned.has(node.id)) return;
      const ring=Math.floor(idx/6);
      const ringItems=attached.slice(ring*6,ring*6+6).filter(n=>!positioned.has(n.id));
      const slot=ringItems.findIndex(n=>n.id===node.id);
      const ringCount=Math.max(1,ringItems.length);
      const angle=Math.PI*0.14 + (Math.PI*0.72)*(ringCount===1?.5:slot/(ringCount-1));
      const radius=108 + ring*62;
      const x=positions[sys.id].x + Math.cos(angle)*radius;
      const y=positions[sys.id].y + 48 + Math.sin(angle)*(58 + ring*18);
      positions[node.id]={x,y};
      positioned.add(node.id);
    });
  });

  const leftovers=nodes.filter(n=>!positioned.has(n.id));
  leftovers.forEach((node,idx)=>{
    const x=120 + idx*((Math.max(width-240,1))/Math.max(leftovers.length-1,1));
    positions[node.id]={x:leftovers.length===1?width/2:x,y:height-42};
  });

  const focusedPath=_graphFocusedPathIdx!=null?data.paths?.[_graphFocusedPathIdx]:null;
  const focusedNodes=new Set(focusedPath?.path||[]);
  const focusedEdges=new Set();
  if(focusedPath?.path?.length){
    for(let i=0;i<focusedPath.path.length-1;i++) focusedEdges.add(edgeKey(focusedPath.path[i],focusedPath.path[i+1]));
  }
  const selectedId=_graphSelectedNodeId;
  const relatedToSelected=selectedId?new Set(linkSet.flatMap(l=>{
    const from=typeof l.source==='object'?l.source.id:l.source;
    const to=typeof l.target==='object'?l.target.id:l.target;
    if(from===selectedId) return [to];
    if(to===selectedId) return [from];
    return [];
  })) : null;

  const edgeMarkup=linkSet.map(link=>{
    const from=typeof link.source==='object'?link.source.id:link.source;
    const to=typeof link.target==='object'?link.target.id:link.target;
    const a=positions[from],b=positions[to];
    if(!a||!b) return '';
    const focused=focusedEdges.has(edgeKey(from,to))||focusedEdges.has(edgeKey(to,from));
    const muted=selectedId && from!==selectedId && to!==selectedId && !relatedToSelected?.has(from) && !relatedToSelected?.has(to);
    return `<path class="graph-mini-edge ${link.isGhost?'ghost':''} ${focused?'focused':''} ${muted?'muted':''}" d="${graphMiniEdgePath(a,b)}"></path>`;
  }).join('');

  const nodeMarkup=nodes.map(node=>{
    const p=positions[node.id];
    if(!p) return '';
    const size=graphMiniNodeSize(node);
    const title=graphMiniNodeLabel(node);
    const meta=graphMiniNodeMeta(node);
    const tone=graphNodeTone(node);
    const isFocused=focusedNodes.has(node.id)||selectedId===node.id;
    const muted=selectedId && node.id!==selectedId && !relatedToSelected?.has(node.id);
    const halo=node.type==='system'?`<circle class="halo" cx="${p.x}" cy="${p.y}" r="${size.r+12}"></circle>`:'';
    return `<g class="graph-mini-node ${esc(node.type||'node')} ${isFocused?'focused':''} ${muted?'muted':''}" data-node-id="${esc(node.id)}">
      ${halo}
      <rect class="core" x="${p.x-size.w/2}" y="${p.y-size.h/2}" width="${size.w}" height="${size.h}" rx="${size.r}" ry="${size.r}"></rect>
      <circle cx="${p.x-size.w/2+14}" cy="${p.y-10}" r="4" fill="${tone}"></circle>
      <text class="title" x="${p.x-size.w/2+26}" y="${p.y-7}">${esc(title)}</text>
      <text class="meta" x="${p.x-size.w/2+26}" y="${p.y+11}">${esc(meta)}</text>
    </g>`;
  }).join('');

  container.innerHTML=`<div class="graph-visual-shell">
    <div class="graph-visual-stage">
      <div class="graph-visual-head">
        <div>
          <div class="graph-visual-title">Compact Attack Map</div>
          <div class="graph-visual-sub">Smaller sessions get a true visual map. Click any node to inspect it, and focus an attack path below to light up the relevant chain.</div>
          <div class="graph-visual-statline">
            <span class="graph-visual-stat">${systems.length} systems</span>
            <span class="graph-visual-stat">${nodes.length-systems.length} linked nodes</span>
            <span class="graph-visual-stat">${linkSet.length} relationships</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          <div class="graph-visual-actions">
            <button class="graph-mode-btn back" onclick="openNavigatorGraph()">Navigator</button>
            <button class="graph-mode-btn" onclick="resetVisualGraphFocus()">Clear Focus</button>
          </div>
          <div class="graph-visual-legend">
            <span class="graph-legend-pill"><i style="background:var(--accent)"></i>System</span>
            <span class="graph-legend-pill"><i style="background:var(--red)"></i>Vulnerability</span>
            <span class="graph-legend-pill"><i style="background:var(--yellow)"></i>Credential</span>
            <span class="graph-legend-pill"><i style="background:var(--purple)"></i>Data / AI edge</span>
          </div>
        </div>
      </div>
      <svg class="graph-visual-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="graphSystemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(0,229,255,.22)"></stop>
            <stop offset="100%" stop-color="rgba(0,229,255,.07)"></stop>
          </linearGradient>
        </defs>
        ${edgeMarkup}
        ${nodeMarkup}
      </svg>
    </div>
    <div class="graph-visual-side">
      <div class="graph-visual-card">
        <h4>Why This Works</h4>
        <p>The visual map is opt-in and only unlocked when the topology stays clean enough to read instantly. As soon as a session gets noisy, R3D keeps users in the navigator instead of risking a messy experience.</p>
      </div>
      <div class="graph-visual-card">
        <h4>Interaction Magic</h4>
        <p>Click a node to inspect it. Focus any attack path below to spotlight the relevant chain. Click the stage background or use Clear Focus to reset the view without losing context.</p>
      </div>
    </div>
  </div>`;

  container.querySelectorAll('[data-node-id]').forEach(el=>{
    el.addEventListener('click',()=>{
      const node=getGraphNodeById(el.dataset.nodeId);
      if(node) inspectGraphNode(node);
      if(_graphData) renderGraphCompactVisual(_graphData);
    });
  });
  const svgEl=container.querySelector('.graph-visual-svg');
  if(svgEl){
    svgEl.addEventListener('click',e=>{
      if(e.target!==svgEl) return;
      _graphSelectedNodeId=null;
      renderGraphOverview();
      if(_graphData) renderGraphCompactVisual(_graphData);
    });
  }
}

function _parseMaybeJsonString(v){
  if(typeof v!=='string') return v;
  const t=v.trim();
  if(!t) return v;
  if((t.startsWith('{')&&t.endsWith('}'))||(t.startsWith('[')&&t.endsWith(']'))){
    try{return JSON.parse(t)}catch{return v}
  }
  return v;
}

function _formatFixPriorityItem(item){
  const normalized=_parseMaybeJsonString(item);
  if(typeof normalized==='string') return {label:normalized,reason:''};
  if(typeof normalized!=='object'||normalized===null) return {label:String(normalized),reason:''};
  const label=
    _str(normalized.action)||
    _str(normalized.label)||
    _str(normalized.edge)||
    _str(normalized.name)||
    _str(normalized.title)||
    _str(normalized.description)||
    _str(normalized.fix)||
    (_str(normalized.from)&&_str(normalized.to)?`${_str(normalized.from)} -> ${_str(normalized.to)}`:'')||
    JSON.stringify(normalized);
  const reason=
    _str(normalized.reasoning)||
    _str(normalized.rationale)||
    _str(normalized.why)||
    (_str(normalized.confidence)?`Confidence: ${_str(normalized.confidence)}`:'');
  return {label,reason};
}

function renderGraphSystemList(data){
  const container=document.getElementById('graph-container');
  if(!data?.nodes?.length){container.innerHTML='<div class="g2d-empty">No graph data yet.</div>';return}

  const SEV_COLOR={CRITICAL:'#ff1744',HIGH:'#ff5252',MEDIUM:'#ff9100',LOW:'#ffea00',INFO:'#69f0ae'};
  const SEV_ORDER=['CRITICAL','HIGH','MEDIUM','LOW','INFO'];
  const systems=data.nodes.filter(n=>n.type==='system');
  const ghostEdges=(_ghostEdgesVisible&&data.enrichment?.additionalEdges)||[];

  function vulnsForSystem(sysId){
    return data.edges.filter(e=>e.to===sysId).map(e=>data.nodes.find(n=>n.id===e.from)).filter(n=>n&&n.type==='vulnerability');
  }

  let sysRows=systems.map(sys=>{
    const sv=vulnsForSystem(sys.id);
    const sevCounts={};sv.forEach(v=>{sevCounts[v.severity]=(sevCounts[v.severity]||0)+1});
    const riskPct=Math.min(100,sys.riskScore||0);
    const riskColor=riskPct>=80?'#ff1744':riskPct>=50?'#ff9100':riskPct>=25?'#ffea00':'#69f0ae';
    const sysGhosts=ghostEdges.filter(ge=>{const f=ge.from||ge.source,t=ge.to||ge.target;return f===sys.id||t===sys.id});
    const critCount=sevCounts.CRITICAL||0;
    const searchable=[
      sys.name||sys.id,
      ...sv.slice(0,40).map(v=>`${v.title||v.name||v.id} ${v.cwe||''}`)
    ].join(' ').toLowerCase();
    return {sys,sv,sevCounts,riskPct,riskColor,sysGhosts,critCount,searchable};
  });

  const searchTerm=_graphListSearch.trim().toLowerCase();
  if(searchTerm) sysRows=sysRows.filter(row=>row.searchable.includes(searchTerm));

  sysRows.sort((a,b)=>{
    if(_graphListSort==='findings') return b.sv.length-a.sv.length || (b.sys.riskScore||0)-(a.sys.riskScore||0);
    if(_graphListSort==='critical') return b.critCount-a.critCount || (b.sys.riskScore||0)-(a.sys.riskScore||0);
    if(_graphListSort==='name') return (a.sys.name||a.sys.id).localeCompare(b.sys.name||b.sys.id);
    return (b.sys.riskScore||0)-(a.sys.riskScore||0);
  });

  const expanded=_graphSelectedNodeId;

  let html=`<div class="graph-shell">
    <div class="graph-toolbar">
      <div class="graph-toolbar-copy">
        <div class="graph-toolbar-title">System Navigation</div>
        <div class="graph-toolbar-sub">Dense sessions stay readable here. Search a host, sort by pressure, and expand a system only when you want the detailed findings.</div>
      </div>
      <div class="graph-toolbar-actions">
        <input class="graph-search" type="search" value="${esc(_graphListSearch)}" placeholder="Search systems, findings, or CWEs" oninput="setGraphListSearch(this.value)">
        <div class="graph-chip-row">
          <button class="graph-chip ${_graphListSort==='risk'?'active':''}" onclick="setGraphListSort('risk')">Top Risk</button>
          <button class="graph-chip ${_graphListSort==='findings'?'active':''}" onclick="setGraphListSort('findings')">Most Findings</button>
          <button class="graph-chip ${_graphListSort==='critical'?'active':''}" onclick="setGraphListSort('critical')">Most Critical</button>
          <button class="graph-chip ${_graphListSort==='name'?'active':''}" onclick="setGraphListSort('name')">Name</button>
        </div>
        <div class="graph-results-note">${sysRows.length} / ${systems.length} systems</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">`;
  if(!sysRows.length) html+=`<div class="g2d-empty">No systems match that search yet.</div>`;
  for(const row of sysRows){
    const {sys,sv,sevCounts,riskPct,riskColor,sysGhosts}=row;
    const isExpanded=expanded===sys.id;
    const sevPills=SEV_ORDER.filter(s=>sevCounts[s]).map(s=>`<span class="g2d-sev-pill" style="background:${SEV_COLOR[s]}18;color:${SEV_COLOR[s]}">${sevCounts[s]} ${s[0]}</span>`).join(' ');
    const denseView=sv.length>18;
    const showAll=!!_graphExpandedFull[sys.id];
    const visibleLimit=denseView&&!showAll?12:sv.length;

    html+=`<div class="g2d-sys-row ${isExpanded?'expanded':''}" data-sys-id="${sys.id}">`;
    html+=`<div class="g2d-sys-header">`;
    html+=`<div style="width:6px;height:28px;border-radius:3px;background:${riskColor};flex-shrink:0"></div>`;
    html+=`<div style="flex:1;min-width:0">
      <div class="g2d-sys-name">${esc(sys.name||sys.id)}</div>
      <div class="g2d-sys-meta">
        <span class="g2d-meta-text">${sv.length} finding${sv.length!==1?'s':''}</span>
        ${sevPills}
        ${sysGhosts.length?`<span class="g2d-ai-pill">+${sysGhosts.length} AI path lead${sysGhosts.length!==1?'s':''}</span>`:''}
      </div>
    </div>`;
    html+=`<div class="g2d-sys-risk">
      <div class="score" style="color:${riskColor}">${riskPct}</div>
      <div class="bar"><span style="width:${riskPct}%;background:${riskColor}"></span></div>
    </div>`;
    html+=`<div class="g2d-chevron" style="transform:rotate(${isExpanded?'180':'0'}deg)">&#9662;</div>`;
    html+=`</div>`;

    if(isExpanded){
      const sorted=sv.slice().sort((a,b)=>(SEV_ORDER.indexOf(a.severity)||4)-(SEV_ORDER.indexOf(b.severity)||4));
      html+=`<div class="g2d-expanded">`;
      if(sysGhosts.length){
        html+=`<div style="background:rgba(179,136,255,.06);border:1px solid rgba(179,136,255,.15);border-radius:var(--r);padding:8px 10px;margin:10px 0;font-size:10px;color:#b388ff;display:flex;align-items:center;gap:6px">
          <span style="display:inline-block;width:16px;height:2px;background:repeating-linear-gradient(90deg,#b388ff 0,#b388ff 4px,transparent 4px,transparent 8px);flex-shrink:0"></span>
          ${sysGhosts.length} AI-hypothesized link${sysGhosts.length!==1?'s':''}: ${sysGhosts.map(g=>esc((g.label||'inferred').substring(0,28))).join(', ')}
        </div>`;
      }
      if(denseView){
        html+=`<div class="g2d-density-note">
          <div>
            <strong>Dense System View</strong>
            <span>${showAll?'Showing the full finding set for this system.':'Showing the highest-priority slice first so the list stays readable.'}</span>
          </div>
          <button onclick="event.stopPropagation();toggleGraphSystemAll('${sys.id}')">${showAll?'Show top 12':'Show all '+sv.length}</button>
        </div>`;
      }
      html+=`<div class="g2d-vuln-list">`;
      for(const v of sorted.slice(0,visibleLimit)){
        const sColor=SEV_COLOR[v.severity]||'#666680';
        html+=`<div class="g2d-vuln-item" data-vuln-id="${v.id}">
          <span style="font-size:8px;font-weight:800;font-family:var(--mono);padding:1px 5px;border-radius:2px;background:${sColor}18;color:${sColor};flex-shrink:0">${v.severity||'?'}</span>
          <span style="font-size:8px;font-family:var(--mono);padding:1px 4px;border-radius:2px;color:${v.status==='confirmed'?'#69f0ae':v.status==='likely'?'#00e5ff':'#666680'};flex-shrink:0">${(v.status||'hypo').substring(0,4).toUpperCase()}</span>
          <span class="title">${esc(v.title||v.name||v.id)}</span>
          ${v.cwe?`<span class="cwe-tag">${esc(v.cwe)}</span>`:''}
        </div>`;
      }
      html+=`</div></div>`;
    }
    html+=`</div>`;
  }
  html+=`</div></div>`;
  container.innerHTML=html;

  container.querySelectorAll('.g2d-sys-header').forEach(header=>{
    header.addEventListener('click',()=>{
      const sysId=header.closest('.g2d-sys-row').dataset.sysId;
      _graphSelectedNodeId=(_graphSelectedNodeId===sysId)?null:sysId;
      renderGraphSystemList(data);
      if(_graphSelectedNodeId){
        const sys=getGraphNodeById(sysId);
        if(sys) inspectGraphNode(sys);
      }else{
        renderGraphOverview();
      }
    });
  });

  container.querySelectorAll('.g2d-vuln-item').forEach(item=>{
    item.addEventListener('click',e=>{
      e.stopPropagation();
      const node=getGraphNodeById(item.dataset.vulnId);
      if(node) inspectGraphNode(node);
    });
  });
}

function renderGraphPaths(data){
  const el=document.getElementById('graph-paths');if(!el)return;
  const paths=data.paths||[];if(!paths.length){el.innerHTML='';return}
  const nodeMap=Object.fromEntries((data.nodes||[]).map(n=>[n.id,n]));
  el.innerHTML=`<div style="font-size:9px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">Attack Paths (${paths.length})</div>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:450px;overflow-y:auto">${paths.slice(0,15).map((p,i)=>{
      const ns=p.path||[];
      const conf=p.minConfidence||'hypothesis';
      const risk=p.riskScore||0;
      const riskBg=risk>=7?'rgba(255,23,68,.15)':risk>=4?'rgba(255,145,0,.1)':'rgba(255,234,0,.08)';
      const riskBorder=risk>=7?'#ff1744':risk>=4?'#ff9100':'#ffea00';
      const resolvedNodes=ns.map(nId=>{const node=nodeMap[nId];return node?(node.name||node.title||nId).substring(0,25):nId.substring(0,20)});
      const pathLabel='Path: '+(p.sourceName||resolvedNodes[0]||'')+' → '+(p.targetName||resolvedNodes[resolvedNodes.length-1]||'');
      return `<div style="padding:10px 14px;background:${riskBg};border-left:3px solid ${riskBorder};border-radius:0 var(--r) var(--r) 0">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <input type="checkbox" class="pick-cb" onchange="togglePick('paths','${i}','${esc(pathLabel)}',this)" ${_picked.paths.has(String(i))?'checked':''}>
          <span style="font-family:var(--mono);font-weight:900;font-size:14px;color:${riskBorder}">${risk.toFixed(1)}</span>
          <span style="font-size:11px;color:var(--txt-br);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(p.sourceName||resolvedNodes[0]||'')} → ${esc(p.targetName||resolvedNodes[resolvedNodes.length-1]||'')}</span>
          <span style="font-size:9px;padding:1px 5px;border-radius:3px;background:${conf==='confirmed'?'rgba(105,240,174,.15)':conf==='likely'?'rgba(255,145,0,.15)':'rgba(102,102,128,.15)'};color:${conf==='confirmed'?'#69f0ae':conf==='likely'?'#ff9100':'#666680'};font-family:var(--mono)">${conf}</span>
          <span style="font-size:10px;color:var(--txt-dim)">${ns.length-1} hop${ns.length-1!==1?'s':''}</span>
          <button class="btn-explain" onclick="focusGraphPath(${i});inspectAttackPath(_graphData.paths[${i}],${i})" style="margin-left:auto">${_graphFocusedPathIdx===i?'Unfocus':'Focus'}</button>
          <button class="btn-explain" onclick="explainGraphPath(this,${i})">Explain</button>
        </div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--txt-dim);margin-top:6px;overflow-x:auto;white-space:nowrap;padding-bottom:2px">${resolvedNodes.map(n=>`<span style="color:var(--accent)">${esc(n)}</span>`).join(' <span style="color:var(--txt-dim)">→</span> ')}</div>
      </div>`}).join('')}</div>`;
}

// ─── Credential Pivot Engine UI ──────────────────────────────────────

window.runPivot=async function(btn){
  btn.classList.add('loading');btn.textContent='Pivoting...';
  const statusEl=document.getElementById('pivot-results');
  if(statusEl)statusEl.innerHTML='<div style="padding:12px;font-size:11px;color:var(--orange)"><span style="display:inline-block;width:10px;height:10px;border:2px solid var(--orange);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px"></span>AI selecting pivot targets and replaying credentials...</div>';
  try{
    const r=await fetch('/r3d/attack/pivot/'+activeDetail.id,{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({maxAttempts:20})});
    const d=await r.json();
    if(d.graph){_graphData=d.graph;const root=document.getElementById('graph-root');if(root)renderFullGraph(root)}
    else if(d.results)renderPivotResults(d.results);
    btn.classList.remove('loading');btn.textContent='Auto-Pivot';
    if(d.message&&!d.results?.length){
      if(statusEl)statusEl.innerHTML=`<div style="padding:12px;font-size:11px;color:var(--txt-dim)">${esc(d.message)}</div>`;
    }
  }catch(e){
    btn.classList.remove('loading');btn.textContent='Auto-Pivot';
    if(statusEl)statusEl.innerHTML=`<div style="padding:12px;font-size:11px;color:var(--red)">Pivot failed: ${esc(e.message)}</div>`;
  }
};

function renderPivotResults(results){
  const el=document.getElementById('pivot-results');if(!el||!results?.length)return;
  const confirmed=results.filter(r=>r.verdict==='confirmed').length;
  const rejected=results.length-confirmed;
  el.innerHTML=`<div style="background:var(--bg3);border-left:3px solid var(--orange);border-radius:0 var(--r) var(--r) 0;padding:16px 20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="font-size:9px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1.5px">Credential Pivot Results</div>
      <span style="font-size:11px;font-weight:800;color:var(--green)">${confirmed} confirmed</span>
      <span style="font-size:11px;color:var(--txt-dim)">${rejected} rejected</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto">
      ${results.map(r=>{
        const isConf=r.verdict==='confirmed';
        const bg=isConf?'rgba(105,240,174,.08)':'rgba(102,102,128,.05)';
        const border=isConf?'#69f0ae':'var(--border)';
        const probe=r.probe||{};
        return `<div style="padding:10px 14px;background:${bg};border:1px solid ${border};border-radius:var(--r)">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:3px;font-family:var(--mono);background:${isConf?'rgba(105,240,174,.15)':'rgba(255,23,68,.1)'};color:${isConf?'#69f0ae':'#ff1744'}">${r.verdict?.toUpperCase()||'?'}</span>
            <span style="font-size:11px;color:var(--accent)">${esc(r.source||'')}</span>
            <span style="color:var(--txt-dim);font-size:10px">→</span>
            <span style="font-size:11px;color:var(--orange);font-weight:700">${esc(r.target||'')}</span>
            ${probe.status?`<span style="font-size:10px;color:var(--txt-dim);font-family:var(--mono)">HTTP ${probe.status}</span>`:''}
          </div>
          <div style="font-size:10px;color:var(--txt-dim);margin-top:4px;line-height:1.5">${esc(r.reasoning||'')}</div>
          ${isConf&&probe.bodyPreview?`<pre style="font-size:9px;color:var(--green);margin:6px 0 0;max-height:60px;overflow:hidden;white-space:pre-wrap;background:var(--bg);padding:6px;border-radius:3px">${esc(probe.bodyPreview.substring(0,300))}</pre>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

// ─── AI Attack Planner UI ────────────────────────────────────────────

let _currentPlan=null;

window.generatePlan=async function(btn){
  btn.classList.add('loading');btn.textContent='Planning...';
  const el=document.getElementById('graph-planner');
  if(el)el.innerHTML='<div style="padding:12px;font-size:11px;color:var(--red)"><span style="display:inline-block;width:10px;height:10px;border:2px solid var(--red);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px"></span>AI generating multi-step attack plan from session data...</div>';
  try{
    const r=await fetch('/r3d/attack/plan/'+activeDetail.id,{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({maxSteps:10})});
    const d=await r.json();
    btn.classList.remove('loading');btn.textContent='Attack Plan';
    if(d.plan){_currentPlan=d.plan;renderAttackPlan(d.plan)}
    else if(el)el.innerHTML=`<div style="padding:12px;font-size:11px;color:var(--red)">Plan generation failed: ${esc(d.error||'unknown error')}</div>`;
  }catch(e){
    btn.classList.remove('loading');btn.textContent='Attack Plan';
    if(el)el.innerHTML=`<div style="padding:12px;font-size:11px;color:var(--red)">Failed: ${esc(e.message)}</div>`;
  }
};

function renderAttackPlan(plan){
  const el=document.getElementById('graph-planner');if(!el)return;
  const steps=plan.steps||[];
  el.innerHTML=`<div style="background:var(--bg3);border-left:3px solid var(--red);border-radius:0 var(--r) var(--r) 0;padding:16px 20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div style="font-size:9px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:1.5px">Attack Plan</div>
      <span style="font-size:12px;font-weight:800;color:var(--txt-br)">${esc(plan.name||'Untitled Plan')}</span>
      ${plan.status==='generated'?`<button class="btn" onclick="executePlan(this)" style="margin-left:auto;font-size:10px;padding:4px 14px;border-color:var(--red);color:var(--red)">Execute Plan</button>`:''}
      ${plan.status==='complete'?`<span style="margin-left:auto;font-size:10px;font-weight:800;color:var(--green)">COMPLETE</span>`:''}
      ${plan.status==='executing'?`<span style="margin-left:auto;font-size:10px;color:var(--orange)"><span style="display:inline-block;width:8px;height:8px;border:2px solid var(--orange);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:4px"></span>Executing...</span>`:''}
    </div>
    <div style="font-size:11px;color:var(--txt-dim);margin-bottom:14px;line-height:1.6">${esc(plan.summary||'')}</div>
    <div style="display:flex;flex-direction:column;gap:6px" id="plan-steps">
      ${steps.map((s,i)=>{
        const result=plan.results?plan.results.find(r=>r.index===s.index):null;
        return renderPlanStep(s,result);
      }).join('')}
    </div>
    ${plan.verdict?renderPlanVerdict(plan.verdict):''}
    <div id="plan-verdict-slot"></div>
  </div>`;
}

function renderPlanStep(step,result){
  const idx=step.index!=null?step.index:0;
  const isBrowser=step.type==='browser';
  const typeBg=isBrowser?'rgba(179,136,255,.15)':'rgba(0,229,255,.12)';
  const typeColor=isBrowser?'#b388ff':'#00e5ff';
  const typeLabel=isBrowser?'BROWSER':'SERVER';
  let statusBadge='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(102,102,128,.15);color:#666680;font-family:var(--mono)">PENDING</span>';
  if(result){
    if(result.passed)statusBadge='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(105,240,174,.15);color:#69f0ae;font-family:var(--mono);font-weight:800">PASSED</span>';
    else if(result.status==='timeout')statusBadge='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(255,145,0,.15);color:#ff9100;font-family:var(--mono)">TIMEOUT</span>';
    else if(result.error)statusBadge='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(255,23,68,.15);color:#ff1744;font-family:var(--mono)">ERROR</span>';
    else statusBadge='<span style="font-size:9px;padding:1px 6px;border-radius:3px;background:rgba(255,23,68,.12);color:#ff5252;font-family:var(--mono)">FAILED</span>';
  }
  const outputPreview=result?.output?result.output.substring(0,200):'';
  return `<div id="plan-step-${idx}" style="padding:10px 14px;background:var(--bg4);border:1px solid var(--border);border-radius:var(--r)">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;font-weight:900;color:var(--txt-br);font-family:var(--mono)">#${idx}</span>
      <span style="font-size:9px;padding:1px 6px;border-radius:3px;background:${typeBg};color:${typeColor};font-family:var(--mono);font-weight:800">${typeLabel}</span>
      ${statusBadge}
      <span style="font-size:10px;color:var(--txt-dim)">${esc(step.target||'')}</span>
    </div>
    <div style="font-size:11px;color:var(--txt);margin-top:4px;font-weight:600">${esc(step.objective||'')}</div>
    ${step.successCriteria?`<div style="font-size:9px;color:var(--txt-dim);margin-top:2px;font-family:var(--mono)">Success: ${esc(step.successCriteria)}</div>`:''}
    ${result?.httpStatus?`<div style="font-size:9px;color:var(--accent);margin-top:3px;font-family:var(--mono)">HTTP ${result.httpStatus}</div>`:''}
    ${outputPreview?`<pre style="font-size:9px;color:var(--txt-dim);margin:4px 0 0;max-height:50px;overflow:hidden;white-space:pre-wrap;background:var(--bg);padding:4px 6px;border-radius:3px">${esc(outputPreview)}</pre>`:''}
    ${result?.error?`<div style="font-size:9px;color:var(--red);margin-top:3px">${esc(result.error)}</div>`:''}
  </div>`;
}

function renderPlanVerdict(v){
  if(!v)return '';
  const verdictColors={CRITICAL:'#ff1744',HIGH:'#ff5252',MEDIUM:'#ff9100',LOW:'#ffea00',INCONCLUSIVE:'#666680'};
  const vc=verdictColors[v.verdict]||'var(--txt-dim)';
  return `<div style="margin-top:14px;padding:14px;background:rgba(${v.verdict==='CRITICAL'||v.verdict==='HIGH'?'255,23,68':'102,102,128'},.08);border:1px solid ${vc};border-radius:var(--r)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:${vc}">Plan Verdict</span>
      <span style="font-size:14px;font-weight:900;color:${vc}">${esc(v.verdict||'?')}</span>
    </div>
    <div style="font-size:11px;color:var(--txt);line-height:1.6;margin-bottom:8px">${esc(v.summary||'')}</div>
    ${v.provenRisks?.length?`<div style="margin-bottom:6px"><div style="font-size:9px;font-weight:800;color:var(--red);margin-bottom:4px">PROVEN RISKS</div>${v.provenRisks.map(r=>`<div style="font-size:10px;color:var(--txt-dim);padding:2px 0">• ${esc(r)}</div>`).join('')}</div>`:''}
    ${v.recommendations?.length?`<div><div style="font-size:9px;font-weight:800;color:var(--green);margin-bottom:4px">RECOMMENDATIONS</div>${v.recommendations.map(r=>`<div style="font-size:10px;color:var(--txt-dim);padding:2px 0">• ${esc(r)}</div>`).join('')}</div>`:''}
  </div>`;
}

window.executePlan=async function(btn){
  if(!_currentPlan)return;
  btn.classList.add('loading');btn.textContent='Executing...';
  _currentPlan.status='executing';
  renderAttackPlan(_currentPlan);
  try{
    await fetch('/r3d/attack/plan/'+activeDetail.id+'/execute',{method:'POST',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify({planId:_currentPlan.planId,stopOnFailure:true})});
  }catch(e){
    btn.classList.remove('loading');btn.textContent='Execute Plan';
  }
};

})();
</script>
</body>
</html>
